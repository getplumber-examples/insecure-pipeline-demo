# Plumber configuration for this demo repository.
#
# Overlay on top of the shipped defaults: every control keeps its default,
# and we tighten two things. We do NOT trust an action just because of who
# owns it. A demo repo and its "dependency" share the `getplumber-examples`
# org, and that shared-org trust is exactly how a malicious same-org action
# gets waved through. The same goes for pinning: `actions/*` is not exempt
# from the commit-SHA rule here, a tag is a tag. Make them prove themselves.
extends: plumber:default
github:
  controls:
    githubActionMustComeFromAuthorizedSources:
      enabled: true
      trustSameOrgActions: false
      minimumStars: 0
    actionsMustBePinnedByCommitSha:
      enabled: true
      trustedOwners: []
