name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Build the container image so a broken Dockerfile fails the PR, not the deploy.
  image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build image
        run: docker build -t insecure-pipeline-demo:${{ github.sha }} .

  # Ship main to Fly.
    permissions:
      contents: read
  deploy:
    runs-on: ubuntu-latest
    needs: [test, image]
    if: github.ref == 'refs/heads/main'
    env:
      MY_TOKEN: ${{ secrets.MY_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Deploy to Stripe
        uses: getplumber-examples/totally-fine-action@4d2732a5b89f872d6f54bf56422d28b1183a7f61 # v1
      - name: Deploy to Fly
        run: echo "would run flyctl deploy here"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
