name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Build the container image so a broken Dockerfile fails the PR, not the deploy.
  image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t insecure-pipeline-demo:${{ github.sha }} .

  # Ship main to Fly.
  deploy:
    needs: [test, image, coverage]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
    env:
      MY_TOKEN: ${{ secrets.MY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Deploy to Stripe
        uses: getplumber-examples/totally-fine-action@v1
      - name: Deploy to Fly
        run: echo "would run flyctl deploy here"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
