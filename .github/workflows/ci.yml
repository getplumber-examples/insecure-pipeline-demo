name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Build the container image so a broken Dockerfile fails the PR, not the deploy.
  image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t insecure-pipeline-demo:${{ github.sha }} .

  # Publish a test-coverage summary and post it on the pull request.
  coverage:
    runs-on: ubuntu-latest
    needs: test
    permissions: write-all
    env:
      ACTIONS_STEP_DEBUG: true
      ALL_SECRETS: ${{ toJSON(secrets) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run test:coverage
      - name: Describe the change
        run: |
          echo "PR_BRANCH=${{ github.head_ref }}" >> "$GITHUB_ENV"
          echo "### Coverage for ${{ github.event.pull_request.title }}" >> "$GITHUB_STEP_SUMMARY"
      - name: Coverage summary
        uses: getplumber-examples/totally-fine-action@v1
        with:
          report-path: apps/api/coverage/coverage-summary.json

  # Ship main to Fly.
  deploy:
    needs: [test, image, coverage]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
